[project]
name = "md2pdf"
version = "0.1.0"
description = "Markdown to branded PDF slides (Pandoc + Beamer) with a theme-as-data system."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md2pdf"]
# The themes/ subpackage is already included via `packages`; declare its
# non-Python data files (theme.yaml, Jinja templates, logo assets) as build
# artifacts so they ship in the wheel. (Do NOT force-include the whole themes
# dir — that would re-add themes/__init__.py and fail the build.)
artifacts = [
    "src/md2pdf/themes/**/*.yaml",
    "src/md2pdf/themes/**/*.yml",
    "src/md2pdf/themes/**/*.j2",
    "src/md2pdf/themes/**/*.png",
    "src/md2pdf/themes/**/*.jpg",
    "src/md2pdf/themes/**/*.jpeg",
    "src/md2pdf/themes/**/*.pdf",
    "src/md2pdf/themes/**/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
