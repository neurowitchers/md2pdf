[project]
name = "md2pdf"
version = "0.1.0"
description = "Markdown to branded PDF slides (Pandoc + Beamer) with a theme-as-data system."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md2pdf"]

[tool.hatch.build.targets.wheel.force-include]
"src/md2pdf/themes" = "md2pdf/themes"

[tool.pytest.ini_options]
testpaths = ["tests"]
